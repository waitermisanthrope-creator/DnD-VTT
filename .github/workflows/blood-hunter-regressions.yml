name: Blood Hunter class regressions
on:
  push:
    branches:
      - fix/blood-hunter-closure-20261013
    paths:
      - 'app/blood_hunter_engine.js'
      - 'app/combat_engine.js'
      - 'app/class_features_engine.js'
      - 'app/magic_engine.js'
      - 'app/network_gameplay.js'
      - 'tests/test_blood_hunter_*.js'
      - '.github/workflows/blood-hunter-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blood-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check app/blood_hunter_engine.js
          node --check tests/test_blood_hunter_patron_selection.js
      - name: Core and orders tests
        run: |
          node tests/test_class_audit_runtime.js
          node tests/test_blood_hunter_completion.js
          node tests/test_blood_hunter_orders.js
          node tests/test_blood_hunter_patron_selection.js
          node tests/test_blood_hunter_rite_focus.js
          node tests/test_blood_hunter_brands.js
          node tests/test_blood_hunter_movement.js
          node tests/test_blood_hunter_bloodlust.js
          node tests/test_blood_hunter_mutagen_advanced.js
          node tests/test_blood_hunter_mystic_frenzy.js
          node tests/test_blood_hunter_arcana.js
          node tests/test_blood_hunter_aether_grid.js
          node tests/test_blood_hunter_aether_network.js
          node tests/test_blood_hunter_aether_host_turn.js
          node tests/test_blood_hunter_teleport_host.js
          node tests/test_blood_hunter_host_brand.js
          node tests/test_blood_hunter_teleport_reactions.js
          node tests/test_blood_hunter_spells.js
          node tests/test_blood_hunter_network_feature.js
          node tests/test_v731_fixes.js
          node tests/test_v732_fixes.js
          (cd app && node ../tests/test_v733_logic_audit.js)
          (cd app && node ../tests/test_v734_network_concentration.js)
          (cd app && node ../tests/test_v737_spellcasting_transaction.js)
          (cd app && node ../tests/test_v738_multiclass_spell_sources.js)
          (cd app && node ../tests/test_v739_prepared_transaction.js)
