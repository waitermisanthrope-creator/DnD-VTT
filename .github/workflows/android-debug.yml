name: Build Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "android/**"
      - "*.png"
      - "*.mp3"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Generate stable web update manifest
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, re
          from pathlib import Path
          text=Path("app/update_manager.js").read_text(encoding="utf-8")
          version=re.search(r"var APP_VERSION = '([^']+)'", text).group(1)
          files=[]
          # Keep the stable web manifest focused on files that can actually change the web app.
          # Class-token PNGs are bundled in the APK and must NOT be redownloaded on every web update.
          # When a class-token image really changes, add that exact path to this list in the same release.
          paths=[
            "index.html",
            "app/character_creation_pergament.js","app/character_creation_pergament.css",
            "app/character_builder_v2.js","app/data/subclasses/subclassesRegistry.js","app/vtt_debug_error_log_v709.js",
            "app/Ambiences.js","app/app.js","app/Settings.js","app/update_manager.js",
            "app/onboarding_faq_v71.js","app/styles.css",
            "1790622844831.png","1790622696215.png","1790622252250.png","1790718758545.png"
          ]
          for path in paths:
            data=Path(path).read_bytes()
            files.append({"path":path,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          manifest={
            "schema":1,"app":"DnD-VTT","version":version,"minAppVersion":"70.25.71",
            "channel":"stable","generated":"AUTO","baseUrl":"https://raw.githubusercontent.com/waitermisanthrope-creator/DnD-VTT/main",
            "files":files,"blockedVersions":[]
          }
          Path("updates/stable.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Publish stable update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          regenerate_manifest() {
            python3 - <<'PY'
          import glob, hashlib, json, re
          from pathlib import Path
          text=Path("app/update_manager.js").read_text(encoding="utf-8")
          version=re.search(r"var APP_VERSION = '([^']+)'", text).group(1)
          files=[]
          # Keep the stable web manifest focused on files that can actually change the web app.
          # Class-token PNGs are bundled in the APK and must NOT be redownloaded on every web update.
          # When a class-token image really changes, add that exact path to this list in the same release.
          paths=[
            "index.html",
            "app/character_creation_pergament.js","app/character_creation_pergament.css",
            "app/character_builder_v2.js","app/data/subclasses/subclassesRegistry.js","app/vtt_debug_error_log_v709.js",
            "app/Ambiences.js","app/app.js","app/Settings.js","app/update_manager.js",
            "app/onboarding_faq_v71.js","app/styles.css",
            "1790622844831.png","1790622696215.png","1790622252250.png","1790718758545.png"
          ]
          for path in paths:
            data=Path(path).read_bytes()
            files.append({"path":path,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          manifest={
            "schema":1,"app":"DnD-VTT","version":version,"minAppVersion":"70.25.71",
            "channel":"stable","generated":"AUTO",
            "baseUrl":"https://raw.githubusercontent.com/waitermisanthrope-creator/DnD-VTT/main",
            "files":files,"blockedVersions":[]
          }
          Path("updates/stable.json").write_text(
            json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY
          }

          # Only the generated manifest is allowed to be dirty in this checkout.
          # Reset to the newest main before every attempt so rebase cannot be blocked
          # by the manifest generated by the previous attempt.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            regenerate_manifest
            git add updates/stable.json

            if git diff --cached --quiet; then
              echo "Stable manifest already matches current main."
              exit 0
            fi

            git commit -m "Auto-publish stable update manifest [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "Failed to publish stable manifest after retries"
          exit 1
      - name: Upload token hashes
        uses: actions/upload-artifact@v4
        with:
          name: token-hashes
          path: updates/stable.json
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-vtt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

# Stable APK build: every main-branch update produces a fresh test artifact.
