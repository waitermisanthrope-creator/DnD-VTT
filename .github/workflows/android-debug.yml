name: Build Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "android/**"
      - "*.png"
      - "*.mp3"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Generate original token hashes
        run: |
          sha256sum index.html app/character_creation_pergament.js app/character_creation_pergament.css app/Ambiences.js app/app.js app/Settings.js app/update_manager.js app/onboarding_faq_v71.js app/styles.css app/data/classes/*.png | sort > token-hashes.txt
      - name: Upload token hashes
        uses: actions/upload-artifact@v4
        with:
          name: token-hashes
          path: token-hashes.txt
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-vtt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
