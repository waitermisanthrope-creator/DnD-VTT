name: Build Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "android/**"
      - "tests/**"
      - "*.png"
      - "*.mp3"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Test Alchemist runtime regressions
        run: node tests/alchemist_runtime_test.js
      - name: Test Alchemist combat integration
        run: node tests/alchemist_combat_test.js
      - name: Test 3D character foundation
        run: node tests/character_3d_foundation_test.js
      - name: Test 3D character editor
        run: node tests/character_3d_editor_test.js
      - name: Syntax check 3D character modules
        run: |
          node --check app/3dmap/character_system.js
          node --check app/3dmap/gltf_character_pipeline.js
          node --check app/3dmap/character_editor_3d.js

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      # Stable update manifest is generated exclusively by refresh-update-manifest.yml.
      # Keeping one publisher prevents Android/Pages CI from overwriting a newer manifest.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-vtt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

# Stable APK build: every main-branch update produces a fresh test artifact.
# V70.26.82: rerun manifest generation after Builder V2 level-1 feature fix.
