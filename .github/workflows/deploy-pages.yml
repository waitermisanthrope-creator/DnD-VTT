name: Deploy VTT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/updates site/wallpapers site/ambience
          cp index.html site/index.html
          cp -R app site/app

          # The repository keeps the heavy media at root so the source tree stays simple.
          # The application expects these runtime directories.
          for f in ./*.png; do
            [ -f "$f" ] || continue
            cp "$f" "site/wallpapers/$(basename "$f")"
          done
          for f in ./*.mp3; do
            [ -f "$f" ] || continue
            cp "$f" "site/ambience/$(basename "$f")"
          done

          python3 tools/build_update_manifest.py \
            --base-url "https://waitermisanthrope-creator.github.io/DnD-VTT" \
            --version "70.25.62" \
            --min-app-version "70.25.61" \
            --channel "stable" \
            --output site/updates/stable.json

          python3 tools/build_update_manifest.py \
            --base-url "https://waitermisanthrope-creator.github.io/DnD-VTT" \
            --version "70.25.62" \
            --min-app-version "70.25.61" \
            --channel "beta" \
            --output site/updates/beta.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
