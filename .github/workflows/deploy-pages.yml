name: Deploy VTT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always build the Pages manifest/site from current main.
          # workflow_run still supplies the exact completed APK artifact below.
          ref: main

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/updates site/wallpapers site/ambience
          cp index.html site/index.html
          cp -R app site/app

          # The repository keeps the heavy media at root so the source tree stays simple.
          # The application expects these runtime directories.
          for f in ./*.png; do
            [ -f "$f" ] || continue
            cp "$f" "site/wallpapers/$(basename "$f")"
          done
          if [ -d wallpapers ]; then
            cp -R wallpapers/. site/wallpapers/
          fi
          for f in ./*.mp3; do
            [ -f "$f" ] || continue
            cp "$f" "site/ambience/$(basename "$f")"
          done

          # Serve only the stable manifest approved by unified multi-platform CI.
          cp updates/stable.json site/updates/stable.json

          python3 tools/build_update_manifest.py \
            --base-url "https://waitermisanthrope-creator.github.io/DnD-VTT" \
            --version "70.33.7" \
            --min-app-version "70.32.21" \
            --channel "beta" \
            --output site/updates/beta.json

      # Keep the historical /downloads/latest.apk URL usable, but serve only
      # the signed APK from the last approved unified GitHub Release.
      - name: Preserve approved Android APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$TAG" ] && gh release download "$TAG" --pattern app-release.apk --dir site/downloads --clobber >/dev/null 2>&1; then
            cp site/downloads/app-release.apk site/downloads/latest.apk
            mv site/downloads/app-release.apk "site/downloads/DND-VTT-${TAG#v}.apk"
            sha256sum site/downloads/latest.apk > site/downloads/latest.apk.sha256
            echo "Published approved signed Android APK from $TAG"
          else
            # A repo without a unified release may still have an older signed
            # APK on Pages. Preserve it instead of publishing a new debug APK.
            curl --fail --location --silent --show-error --max-time 120 \
              "https://waitermisanthrope-creator.github.io/DnD-VTT/downloads/latest.apk" \
              -o site/downloads/latest.apk || {
                rm -f site/downloads/latest.apk
                echo "No previously approved APK available; Pages update stays web-only"
              }
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
