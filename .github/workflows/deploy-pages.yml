name: Deploy VTT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Android debug APK", "Build Android signed release APK"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/updates site/wallpapers site/ambience
          cp index.html site/index.html
          cp -R app site/app

          # The repository keeps the heavy media at root so the source tree stays simple.
          # The application expects these runtime directories.
          for f in ./*.png; do
            [ -f "$f" ] || continue
            cp "$f" "site/wallpapers/$(basename "$f")"
          done
          if [ -d wallpapers ]; then
            cp -R wallpapers/. site/wallpapers/
          fi
          for f in ./*.mp3; do
            [ -f "$f" ] || continue
            cp "$f" "site/ambience/$(basename "$f")"
          done

          python3 tools/build_update_manifest.py \
            --base-url "https://waitermisanthrope-creator.github.io/DnD-VTT" \
            --version "70.37.60" \
            --min-app-version "70.26.99" \
            --channel "stable" \
            --output site/updates/stable.json

          python3 tools/build_update_manifest.py \
            --base-url "https://waitermisanthrope-creator.github.io/DnD-VTT" \
            --version "70.33.7" \
            --min-app-version "70.32.21" \
            --channel "beta" \
            --output site/updates/beta.json

      - name: Download Android APK from completed build
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: ${{ github.event.workflow_run.name == 'Build Android signed release APK' && 'dnd-vtt-release-apk' || 'dnd-vtt-debug-apk' }}
          path: site/downloads
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable APK names
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.workflow_run.name }}" = "Build Android signed release APK" ]; then
            APK="app-release.apk"
          else
            APK="app-debug.apk"
          fi
          mv "site/downloads/$APK" site/downloads/DND-VTT-70.37.60.apk
          cp site/downloads/DND-VTT-70.37.60.apk site/downloads/latest.apk
          sha256sum site/downloads/DND-VTT-70.37.60.apk > site/downloads/DND-VTT-70.37.60.apk.sha256

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
