name: Refresh in-app update manifest

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "tools/build_update_manifest.py"
      - ".github/workflows/refresh-update-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-update-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate and publish complete stable manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            python3 tools/build_update_manifest.py \
              --base-url "https://raw.githubusercontent.com/waitermisanthrope-creator/DnD-VTT/main" \
              --version "70.32.07" \
              --min-app-version "70.25.71" \
              --channel "stable" \
              --output updates/stable.json
            if git diff --quiet -- updates/stable.json; then
              echo "Manifest is already current"
              exit 0
            fi
            git add updates/stable.json
            git commit -m "Refresh stable in-app update manifest"
            if git push origin HEAD:main; then
              echo "Published complete stable manifest"
              exit 0
            fi
            echo "main moved during publish; retrying against latest main"
            git reset --hard HEAD~1
          done
          echo "Could not publish manifest after retries"
          exit 1
