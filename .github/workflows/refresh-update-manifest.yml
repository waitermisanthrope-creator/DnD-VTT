name: Legacy stable manifest publisher (disabled)

# IMPORTANT: Do not publish new stable manifests from source pushes.
# Publishing before Windows and Android both pass would create a mixed release.
# Use "Unified Android + Windows release" workflow instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This legacy workflow no longer publishes stable.json."
          echo "Use Actions -> Unified Android + Windows release -> Run workflow."
