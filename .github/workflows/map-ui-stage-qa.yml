name: Map UI stage QA
on:
  push:
    branches: [main]
    paths: ['app/3dmap/**', 'tests/map_*', 'tools/check_map_browser.js', '.github/workflows/map-ui-stage-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jsdom playwright
      - run: node tests/map_rebuild_world_test.js && node tests/map_editor_dom_test.js
      - run: node tools/check_map_browser.js
        env:
          MAP_CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-ui-screenshots
          path: docs/map_rebuild/*.png
