name: Build Android signed release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DND_VTT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DND_VTT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DND_VTT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DND_VTT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing DND_VTT_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing DND_VTT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing DND_VTT_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing DND_VTT_KEY_PASSWORD"; exit 1; }

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DND_VTT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/dnd-vtt-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "DND_VTT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          DND_VTT_KEYSTORE_PASSWORD: ${{ secrets.DND_VTT_KEYSTORE_PASSWORD }}
          DND_VTT_KEY_ALIAS: ${{ secrets.DND_VTT_KEY_ALIAS }}
          DND_VTT_KEY_PASSWORD: ${{ secrets.DND_VTT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "SHA-256:"
          sha256sum "$APK"
          echo "Certificate:"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-vtt-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
