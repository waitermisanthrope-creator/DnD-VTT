name: Build Android signed release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/app/src/main/java/com/dndvtt/app/DndUpdateBridge.java"
      - "android/app/src/main/java/com/dndvtt/app/MainActivity.java"
      - "app/campaign_manager.js"
      - "app/character_builder_v2.js"
      - "app/character_creation_pergament.js"
      - "tests/test_v755_creation_buckets.js"
      - "app/dice.js"
      - "app/3dmap/**"

      - "app/dnd_tools.js"
      - "app/rulesEngine.js"
      - "app/update_manager.js"
      - "app/update_manager_v2.js"
      - "app/update_scene_v2.js"
      - "app/update_scene_v755.js"
      - "app/assets/ui/update_scene_*.svg"
      - "tests/test_v755_update_scene.js"
      - "android/app/build.gradle"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run creation and updater contract tests
        run: |
          node tests/test_v755_creation_buckets.js
          node tests/test_v755_update_scene.js

      - name: Deep furniture texture diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          import json, struct, zlib
          from pathlib import Path
          root=Path(".")
          png=root/"app/assets/3d/quaternius/textures/T_Trim_Furniture_BaseColor.png"
          data=png.read_bytes()
          assert data[:8]==b"\x89PNG\r\n\x1a\n"
          pos=8; w=h=ct=None; idat=b""
          while pos<len(data):
              n=struct.unpack(">I",data[pos:pos+4])[0]; typ=data[pos+4:pos+8]; chunk=data[pos+8:pos+8+n]; pos+=12+n
              if typ==b"IHDR": w,h,bd,ct,_,_,_=struct.unpack(">IIBBBBB",chunk)
              if typ==b"IDAT": idat+=chunk
              if typ==b"IEND": break
          raw=zlib.decompress(idat)
          channels={0:1,2:3,3:1,4:2,6:4}[ct]; bpp=channels
          rows=[]; prev=[0]*(w*bpp); off=0
          for y in range(h):
              f=raw[off]; off+=1; row=list(raw[off:off+w*bpp]); off+=w*bpp
              for i in range(len(row)):
                  a=row[i-bpp] if i>=bpp else 0; b=prev[i]; c=prev[i-bpp] if i>=bpp else 0
                  if f==1: row[i]=(row[i]+a)&255
                  elif f==2: row[i]=(row[i]+b)&255
                  elif f==3: row[i]=(row[i]+((a+b)//2))&255
                  elif f==4:
                      p=a+b-c; pa=abs(p-a); pb=abs(p-b); pc=abs(p-c); pr=a if pa<=pb and pa<=pc else (b if pb<=pc else c); row[i]=(row[i]+pr)&255
              rows.append(row); prev=row
          alphas=[]
          if ct==6:
              for row in rows: alphas.extend(row[3::4])
          elif ct==4:
              for row in rows: alphas.extend(row[1::2])
          else:
              alphas=[255]*(w*h)
          print("FURNITURE_PNG",w,h,"color_type",ct,"alpha_min",min(alphas),"alpha_max",max(alphas),"alpha_zero",sum(a==0 for a in alphas),"pixels",len(alphas))
          for name in ["Barrel","Shelf_Simple","Bookcase_2"]:
              g=json.loads((root/f"app/assets/3d/quaternius/models/{name}.gltf").read_text())
              print("MODEL",name,"samplers",g.get("samplers"),"materials",[(m.get("name"),m.get("alphaMode"),m.get("alphaCutoff")) for m in g.get("materials",[])])
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DND_VTT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DND_VTT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DND_VTT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DND_VTT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing DND_VTT_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing DND_VTT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing DND_VTT_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing DND_VTT_KEY_PASSWORD"; exit 1; }

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DND_VTT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/dnd-vtt-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "DND_VTT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          DND_VTT_KEYSTORE_PASSWORD: ${{ secrets.DND_VTT_KEYSTORE_PASSWORD }}
          DND_VTT_KEY_ALIAS: ${{ secrets.DND_VTT_KEY_ALIAS }}
          DND_VTT_KEY_PASSWORD: ${{ secrets.DND_VTT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "SHA-256:"
          sha256sum "$APK"
          echo "Certificate:"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-vtt-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
# release 70.37.60 trigger
