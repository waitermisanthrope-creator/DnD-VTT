name: Unpack project archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert class token JPGs to PNG without pixel cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("app/data/classes")
          pairs=[(src,src.with_suffix(".png")) for src in sorted(root.glob("*.jpg"))]
          p=Path("app/character_creation_pergament.js")
          text=p.read_text(encoding="utf-8")
          for src,dst in pairs:
              with Image.open(src) as im:
                  if im.mode not in ("RGB","RGBA"):
                      im=im.convert("RGB")
                  im.save(dst,format="PNG",optimize=False)
              text=text.replace("./app/data/classes/"+src.name,"./app/data/classes/"+dst.name)
          p.write_text(text,encoding="utf-8")
          for src,_ in pairs:
              src.unlink()
          PY

      - name: Commit converted class tokens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/classes app/character_creation_pergament.js
          if git diff --cached --quiet; then
            echo "No token conversion changes."
            exit 0
          fi
          git commit -m "Convert class tokens to PNG without pixel cleanup"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Unpack V70.25.61 archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="DND_VTT_V70_25_61_UPDATE_INFRA_NO_ASSETS.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive not present; nothing to unpack."
            exit 0
          fi
          rm -rf .project_unpack
          mkdir -p .project_unpack
          unzip -q "$ARCHIVE" -d .project_unpack
          top_count="$(find .project_unpack -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          if [ "$top_count" = "1" ] && [ -d "$(find .project_unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SRC="$(find .project_unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          else
            SRC=".project_unpack"
          fi
          rsync -a "$SRC"/ ./
          rm -rf .project_unpack "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack V70.25.61 project files" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
