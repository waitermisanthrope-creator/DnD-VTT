name: Audit human GLB

on:
  push:
    branches: [main]
    paths:
      - "human-base-rigged.glb"
      - "tests/human_base_glb_audit.js"
      - ".github/workflows/human-glb-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check human-base-rigged.glb
        run: |
          echo "::group::HUMAN GLB STRUCTURAL AUDIT"
          node tests/human_base_glb_audit.js
          echo "::endgroup::"

      - name: Audit result marker
        if: success()
        run: |
          echo "========================================"
          echo "HUMAN GLB AUDIT: ПРОЙДЕН"
          echo "Файл: human-base-rigged.glb"
          echo "Подробный JSON находится выше в шаге Check human-base-rigged.glb"
          echo "========================================"
