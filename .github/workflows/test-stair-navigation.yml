name: Test 3D stair navigation
on:
  push:
    branches: [main]
    paths:
      - 'app/3dmap/stair_navigation.js'
      - 'app/3dmap/map_editor.js'
      - 'app/data/maps/3d_stress_v740026.json'
      - 'tests/stair_navigation.cjs'
      - '.github/workflows/test-stair-navigation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app/3dmap/stair_navigation.js
          node --check app/3dmap/map_editor.js
          node --check app/3dmap/map_renderer_3d.js
      - name: Walkable staircase tests
        run: node tests/stair_navigation.cjs
