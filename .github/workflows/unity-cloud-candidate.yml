name: Unity cloud Android candidate

# Verified Android and Windows candidates. Never publish or change update feed.
on:
  push:
    branches: [experiment/unity-vtt]
    paths:
      - '.github/workflows/unity-cloud-candidate.yml'
      - 'unity/Assets/**'
      - 'unity/Packages/**'
      - 'unity/ProjectSettings/**'
      - 'unity/Tools/**'
      - 'unity/ci/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Unpublished Android candidate, newer than public version'
        required: true
        default: '1.00.32'
        type: string

permissions:
  contents: read

concurrency:
  group: unity-cloud-private-candidate
  cancel-in-progress: true

jobs:
  android:
    name: Build and verify signed Android ARM64 APK
    if: github.repository == 'waitermisanthrope-creator/DnD-VTT' && github.ref == 'refs/heads/experiment/unity-vtt' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Reject candidate version already present in update channel
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '1.00.32' }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from unity.ci.cloud_release import version_code
          active = json.load(open('updates/unity-experiment.json', encoding='utf-8'))
          candidate = version_code(os.environ['CANDIDATE_VERSION'])
          if candidate <= active['versionCode']:
              raise SystemExit('Candidate must be newer than active Android update channel')
          print('CANDIDATE_MONOTONIC_VERSION_PASS:', candidate, '>', active['versionCode'])
          PYCODE
      - name: Verify original JS source provenance
        run: python3 unity/ci/check_sheet_provenance.py
      - name: Prepare Android SDK and validate CI safety contracts
        run: |
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' >/dev/null
          python3 -m pip install -r unity/ci/requirements.txt
          python3 unity/ci/test_cloud_release.py
          python3 unity/ci/test_update_settings_contract.py
          python3 unity/ci/test_brand_visual_contract.py
          python3 unity/ci/test_content_registry_contract.py
      - name: Verify PostgreSQL roles, MFA, approvals and cloud RLS
        run: |
          npm ci --prefix supabase/tests --ignore-scripts --no-audit --no-fund
          node supabase/tests/access-control.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test real package install, restart, removal and character integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workshop-registries"
          python3 unity/ci/verify_public_workshop.py --output "$RUNNER_TEMP/workshop-registries"
          dotnet run --project unity/ci/workshop-tests -- "$RUNNER_TEMP/workshop-registries" "$GITHUB_WORKSPACE"
          mkdir -p unity/WorkshopFixtures~
          cp -R "$RUNNER_TEMP/workshop-registries/." unity/WorkshopFixtures~/
      - uses: actions/upload-artifact@v4
        with:
          name: Verified-dice-recipes-${{ github.run_id }}
          path: |
            unity/WorkshopFixtures~/DnD-VTT-Assets/catalog/v5/index.json
            unity/WorkshopFixtures~/DnD-VTT-Assets/catalog/v6/index.json
            unity/WorkshopFixtures~/DnD-VTT-Assets/catalog/v8/index.json
            unity/WorkshopFixtures~/DnD-VTT-Assets/catalog/v9/index.json
            unity/WorkshopFixtures~/DnD-VTT-Assets/packages/dnd.dice.*.json
          if-no-files-found: error
      - name: Verify signing key matches published Android 1.00.00
        env:
          UNITY_ANDROID_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
          UNITY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 unity/ci/cloud_release.py check-key
      - name: Verify cloud Unity license configuration
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: python3 unity/ci/cloud_release.py check-license
      - name: Prepare unpublished Android version in checkout only
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '1.00.32' }}
        run: python3 unity/ci/cloud_release.py prepare --version "$CANDIDATE_VERSION"
      - name: Restore Unity import and IL2CPP cache (no credentials)
        id: unity-library
        uses: actions/cache/restore@v4
        with:
          path: unity/Library
          key: unity-library-android-${{ runner.os }}-6000.3.26f1-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**', 'unity/Assets/**') }}
          restore-keys: |
            unity-library-android-${{ runner.os }}-6000.3.26f1-
      # GameCI CLI v0.1.72 can report validateBuild failure even after Unity
      # logs VTT_RELEASE_BUILD_PASS and produces an APK. Preserve the output for
      # strict, independent verification below; a real Unity failure still
      # stops here because the intermediate APK will be missing/invalid.
      - name: Build native Unity Android ARM64 IL2CPP APK
        id: unity-build
        timeout-minutes: 25
        continue-on-error: true
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.26f1
          cliVersion: v0.1.72
          targetPlatform: Android
          buildMethod: UnityReleaseBuild.CloudAndroid
          versioning: None
          androidExportType: androidPackage
          allowDirtyBuild: true
          manualExit: true
          enableGpu: true
          customParameters: -force-glcore
      - name: Strictly validate real Unity player output (not GameCI return status)
        shell: bash
        run: |
          set -euo pipefail
          APK="unity/Builds/Unity-${{ inputs.version || '1.00.32' }}/android-intermediate.apk"
          test -s "$APK"
          test "$(stat -c '%s' "$APK")" -gt 10000000
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -F "name='com.dndvtt.unity'" <<<"$badging"
          expected_version="${{ inputs.version || '1.00.32' }}"
          IFS=. read -r major minor patch <<< "$expected_version"
          printf -v expected_code '%d' "$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
          grep -F "versionCode='$expected_code'" <<<"$badging"
          grep -F "versionName='${{ inputs.version || '1.00.32' }}'" <<<"$badging"
          grep -F "native-code: 'arm64-v8a'" <<<"$badging"
          python3 unity/ci/verify_launcher_aliases.py "$APK" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt"
          sha256sum "$APK"
          echo "CI_REAL_UNITY_ANDROID_APK_PASS: output exists and Android package metadata matches"
      - name: Save measured Unity build resource report
        uses: actions/upload-artifact@v4
        with:
          name: Unity-build-resource-report-${{ github.run_id }}
          path: unity/Builds/Unity-*/build-report-Android.json
          if-no-files-found: error
      - name: Restore runner ownership of Docker-generated Android build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="unity/Builds/Unity-${{ inputs.version || '1.00.32' }}"
          test -s "$BUILD_DIR/android-intermediate.apk"
          # game-ci/unity-builder writes the intermediate files as root inside
          # Docker. The host runner must own them to create the signed APK.
          sudo chown -R "$(id -u):$(id -g)" "$BUILD_DIR"
          test -w "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/distribution"
          test -w "$BUILD_DIR/distribution"
          echo "CI_ANDROID_BUILD_PERMISSIONS_PASS"
      - name: Sign with original key and verify package, version, ARM64 and certificate
        env:
          UNITY_ANDROID_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
          UNITY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 unity/ci/cloud_release.py sign
          python3 unity/ci/cloud_release.py android-candidate
      - name: Measure real signed APK and validate retained artwork and prop imports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install UnityPy==1.25.4
          APK="unity/Builds/Unity-${{ inputs.version || '1.00.32' }}/distribution/DnD-VTT-Unity-${{ inputs.version || '1.00.32' }}-arm64.apk"
          python3 tools/inspect_unity_apk.py --apk "$APK" --output unity/apk-object-inventory.json
          python3 unity/ci/measure_apk.py --apk "$APK" --objects unity/apk-object-inventory.json --report unity/apk-metrics.json --minimal-content
      - name: Save measured APK inventory and metrics
        uses: actions/upload-artifact@v4
        with:
          name: Unity-APK-measurements-${{ github.run_id }}
          path: |
            unity/apk-metrics.json
            unity/apk-object-inventory.json
            unity/Builds/Unity-*/distribution/candidate.json
            unity/Builds/Unity-*/distribution/SHA256SUMS.txt
          if-no-files-found: error
      - name: Deliver verified signed Android APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: DnD-VTT-Unity-${{ inputs.version || '1.00.32' }}-Android-test
          path: unity/Builds/Unity-${{ inputs.version || '1.00.32' }}/distribution/DnD-VTT-Unity-${{ inputs.version || '1.00.32' }}-arm64.apk
          if-no-files-found: error
          retention-days: 3
      - name: Verify separately generated trusted Android demo bundle
        id: workshop-bundle
        run: python3 unity/ci/verify_bundle_output.py
      - name: Save verified Android bundle for manual runtime QA
        if: steps.workshop-bundle.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Unity-workshop-Android-${{ github.run_id }}
          path: unity/Builds/Workshop/android-arm64/
          if-no-files-found: error
          retention-days: 7
      - name: Encrypt unpublished APK candidate
        env:
          UNITY_CI_ARTIFACT_PASSWORD: ${{ secrets.UNITY_CI_ARTIFACT_PASSWORD }}
        run: python3 unity/ci/cloud_release.py seal
      - name: Save private candidate for owner review
        uses: actions/upload-artifact@v4
        with:
          name: Unity-private-android-${{ github.run_id }}
          path: ${{ runner.temp }}/unity-encrypted/candidate.zip.enc
          if-no-files-found: error
          retention-days: 7
      - name: Save Unity import and IL2CPP cache for subsequent checked builds
        if: always() && steps.unity-library.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: unity/Library
          key: ${{ steps.unity-library.outputs.cache-primary-key }}

      - name: Upload rendered procedural dice validation images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-dice-previews-${{ github.run_id }}
          path: unity/Builds/DiceValidation/*.png
          if-no-files-found: ignore
          retention-days: 7

  windows-build:
    name: Build verified Windows x64 installer
    needs: android
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin checkout to candidate source
        run: git checkout --detach "$GITHUB_SHA"
      - name: Prepare same candidate version
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '1.00.32' }}
        run: python3 unity/ci/cloud_release.py prepare --version "$CANDIDATE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: Verified-dice-recipes-${{ github.run_id }}
          path: unity/WorkshopFixtures~/DnD-VTT-Assets
      - name: Build actual Windows x64 Mono player
        timeout-minutes: 25
        continue-on-error: true
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.26f1
          cliVersion: v0.1.72
          targetPlatform: StandaloneWindows64
          buildMethod: UnityReleaseBuild.CloudWindows
          versioning: None
          allowDirtyBuild: true
          manualExit: true
          enableGpu: true
          customParameters: -force-glcore
      - name: Verify actual Windows output and restore ownership
        run: |
          sudo chown -R "$(id -u):$(id -g)" unity/Builds
          test -s "unity/Builds/Unity-${{ inputs.version || '1.00.32' }}/windows/DndVtt.exe"
          test -s "unity/Builds/Unity-${{ inputs.version || '1.00.32' }}/windows/UnityPlayer.dll"
          test -s "unity/Builds/Unity-${{ inputs.version || '1.00.32' }}/windows/DndVtt_Data/Managed/Assembly-CSharp.dll"
      - uses: actions/download-artifact@v4
        with:
          name: DnD-VTT-Unity-${{ inputs.version || '1.00.32' }}-Android-test
          path: unity/Builds/Unity-${{ inputs.version || '1.00.32' }}/distribution
      - name: Install existing packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes nsis
          python3 -m venv "$RUNNER_TEMP/vtt-windows-python"
          echo "$RUNNER_TEMP/vtt-windows-python/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vtt-windows-python/bin/python" -m pip install --no-cache-dir -r unity/ci/requirements.txt
      - name: Package using existing NSIS installer
        shell: pwsh
        run: |
          git checkout -B experiment/unity-vtt
          ./unity/release.ps1 -Stage Package -Nsis /usr/bin/makensis
      - name: Record both packages and encrypt existing candidate format
        env:
          UNITY_CI_ARTIFACT_PASSWORD: ${{ secrets.UNITY_CI_ARTIFACT_PASSWORD }}
        run: |
          python3 unity/ci/cloud_release.py candidate
          python3 unity/ci/cloud_release.py seal
      - uses: actions/upload-artifact@v4
        with:
          name: Unity-private-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/unity-encrypted/candidate.zip.enc
          if-no-files-found: error
          retention-days: 7

  windows-qa:
    name: Install and upgrade from public 1.00.00 on isolated Windows runner
    needs: windows-build
    runs-on: windows-latest
    environment: unity-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Unity-private-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/unity-encrypted
      - name: Authenticate and decrypt in runner temporary directory
        env:
          UNITY_CI_ARTIFACT_PASSWORD: ${{ secrets.UNITY_CI_ARTIFACT_PASSWORD }}
        shell: pwsh
        run: |
          python -m pip install -r unity/ci/requirements.txt
          python unity/ci/cloud_release.py unseal --source "$env:RUNNER_TEMP/unity-encrypted" --destination "$env:RUNNER_TEMP/unity-candidate"
      - name: Verify installed payload, old saves, actual runtime and reinstall
        shell: pwsh
        run: ./unity/ci/windows-upgrade-qa.ps1 -CandidateFolder "$env:RUNNER_TEMP/unity-candidate"
      - name: Upload non-sensitive QA verdict only
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Windows-upgrade-verdict-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-upgrade-result.json
          if-no-files-found: error
          retention-days: 7
