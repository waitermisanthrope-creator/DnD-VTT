name: Unity cloud private candidate

# A candidate build is NOT a publication. No release/feed write permission.
on:
  push:
    branches: [experiment/unity-vtt]
    paths:
      - '.github/workflows/unity-cloud-candidate.yml'
      - 'unity/ci/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Unpublished candidate version; must exceed public version'
        required: true
        default: '1.00.01'
        type: string

permissions:
  contents: read

concurrency:
  group: unity-cloud-private-candidate
  cancel-in-progress: false

jobs:
  signing:
    name: Verify cloud signing key against public 1.00.00
    if: github.repository == 'waitermisanthrope-creator/DnD-VTT' && github.ref == 'refs/heads/experiment/unity-vtt' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure pinned Android verification tools
        run: |
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' >/dev/null
      - name: Validate CI helper safety contracts
        run: |
          python3 -m pip install -r unity/ci/requirements.txt
          python3 unity/ci/test_cloud_release.py
      - name: Open protected key and verify published APK independently
        env:
          UNITY_ANDROID_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
          UNITY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 unity/ci/cloud_release.py check-key

  license:
    name: Unity license preflight (not a build)
    if: github.repository == 'waitermisanthrope-creator/DnD-VTT' && github.ref == 'refs/heads/experiment/unity-vtt' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require owner-provisioned supported CI license
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: python3 unity/ci/cloud_release.py check-license

  build:
    name: Build both release packages on GitHub Linux runner
    needs: [signing, license]
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Prepare unpublished candidate constants (checkout only)
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '1.00.01' }}
        run: python3 unity/ci/cloud_release.py prepare --version "$CANDIDATE_VERSION"
      - name: Build actual Windows x64 Mono release using existing entry point
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.26f1
          targetPlatform: StandaloneWindows64
          buildMethod: UnityReleaseBuild.Windows
          versioning: None
          allowDirtyBuild: true
      - name: Build actual Android ARM64 IL2CPP release using existing entry point
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.26f1
          targetPlatform: Android
          buildMethod: UnityReleaseBuild.Android
          versioning: None
          androidExportType: androidPackage
          allowDirtyBuild: true
      - name: Sign with permanent release key; verify cert/package/code/ARM64/alignment
        env:
          UNITY_ANDROID_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
          UNITY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' >/dev/null
          python3 unity/ci/cloud_release.py sign
      - name: Install NSIS packaging tools
        run: sudo apt-get update -qq && sudo apt-get install --yes nsis
      - name: Package Windows Setup using existing installer and script
        shell: pwsh
        run: ./unity/release.ps1 -Stage Package -Nsis /usr/bin/makensis
      - name: Validate both packages and exact Windows payload
        run: python3 unity/ci/cloud_release.py candidate
      - name: Encrypt both installers before any artifact upload
        env:
          UNITY_CI_ARTIFACT_PASSWORD: ${{ secrets.UNITY_CI_ARTIFACT_PASSWORD }}
        run: |
          python3 -m pip install -r unity/ci/requirements.txt
          python3 unity/ci/cloud_release.py seal
      - name: Upload encrypted candidate only (public repository)
        uses: actions/upload-artifact@v4
        with:
          name: Unity-private-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/unity-encrypted/candidate.zip.enc
          if-no-files-found: error
          retention-days: 7

  windows-qa:
    name: Install and upgrade from public 1.00.00 on isolated Windows runner
    needs: build
    runs-on: windows-latest
    environment: unity-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Unity-private-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/unity-encrypted
      - name: Authenticate and decrypt in runner temporary directory
        env:
          UNITY_CI_ARTIFACT_PASSWORD: ${{ secrets.UNITY_CI_ARTIFACT_PASSWORD }}
        shell: pwsh
        run: |
          python -m pip install -r unity/ci/requirements.txt
          python unity/ci/cloud_release.py unseal --source "$env:RUNNER_TEMP/unity-encrypted" --destination "$env:RUNNER_TEMP/unity-candidate"
      - name: Verify installed payload, old saves, actual runtime and reinstall
        shell: pwsh
        run: ./unity/ci/windows-upgrade-qa.ps1 -CandidateFolder "$env:RUNNER_TEMP/unity-candidate"
      - name: Upload non-sensitive QA verdict only
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Windows-upgrade-verdict-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-upgrade-result.json
          if-no-files-found: error
          retention-days: 7
