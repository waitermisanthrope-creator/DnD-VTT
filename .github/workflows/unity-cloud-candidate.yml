name: Unity cloud Android candidate

# Android only. Never compile Windows, run NSIS, publish a release, or write
# the Unity update feed. Produces an encrypted, signed private APK candidate.
on:
  push:
    branches: [experiment/unity-vtt]
    paths:
      - '.github/workflows/unity-cloud-candidate.yml'
      - 'unity/Assets/**'
      - 'unity/Packages/**'
      - 'unity/ProjectSettings/**'
      - 'unity/Tools/**'
      - 'unity/ci/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Unpublished Android candidate, newer than public version'
        required: true
        default: '1.00.01'
        type: string

permissions:
  contents: read

concurrency:
  group: unity-cloud-private-candidate
  cancel-in-progress: true

jobs:
  android:
    name: Build and verify signed Android ARM64 APK
    if: github.repository == 'waitermisanthrope-creator/DnD-VTT' && github.ref == 'refs/heads/experiment/unity-vtt' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Verify original JS source provenance
        run: python3 unity/ci/check_sheet_provenance.py
      - name: Prepare Android SDK and validate CI safety contracts
        run: |
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' >/dev/null
          python3 -m pip install -r unity/ci/requirements.txt
          python3 unity/ci/test_cloud_release.py
      - name: Verify signing key matches published Android 1.00.00
        env:
          UNITY_ANDROID_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
          UNITY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 unity/ci/cloud_release.py check-key
      - name: Verify cloud Unity license configuration
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: python3 unity/ci/cloud_release.py check-license
      - name: Prepare unpublished Android version in checkout only
        env:
          CANDIDATE_VERSION: ${{ inputs.version || '1.00.01' }}
        run: python3 unity/ci/cloud_release.py prepare --version "$CANDIDATE_VERSION"
      # GameCI CLI v0.1.72 can report validateBuild failure even after Unity
      # logs VTT_RELEASE_BUILD_PASS and produces an APK. Preserve the output for
      # strict, independent verification below; a real Unity failure still
      # stops here because the intermediate APK will be missing/invalid.
      - name: Build native Unity Android ARM64 IL2CPP APK
        id: unity-build
        continue-on-error: true
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.26f1
          cliVersion: v0.1.72
          targetPlatform: Android
          buildMethod: UnityReleaseBuild.CloudAndroid
          versioning: None
          androidExportType: androidPackage
          allowDirtyBuild: true
      - name: Strictly validate real Unity player output (not GameCI return status)
        shell: bash
        run: |
          set -euo pipefail
          APK="unity/Builds/Unity-${{ inputs.version || '1.00.01' }}/android-intermediate.apk"
          test -s "$APK"
          test "$(stat -c '%s' "$APK")" -gt 10000000
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -F "name='com.dndvtt.unity'" <<<"$badging"
          expected_version="${{ inputs.version || '1.00.01' }}"
          IFS=. read -r major minor patch <<< "$expected_version"
          printf -v expected_code '%d' "$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
          grep -F "versionCode='$expected_code'" <<<"$badging"
          grep -F "versionName='${{ inputs.version || '1.00.01' }}'" <<<"$badging"
          grep -F "native-code: 'arm64-v8a'" <<<"$badging"
          sha256sum "$APK"
          echo "CI_REAL_UNITY_ANDROID_APK_PASS: output exists and Android package metadata matches"
      - name: Sign with original key and verify package, version, ARM64 and certificate
        env:
          UNITY_ANDROID_KEYSTORE_BASE64: ${{ secrets.UNITY_ANDROID_KEYSTORE_BASE64 }}
          UNITY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UNITY_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 unity/ci/cloud_release.py sign
          python3 unity/ci/cloud_release.py android-candidate
      - name: Encrypt unpublished APK candidate
        env:
          UNITY_CI_ARTIFACT_PASSWORD: ${{ secrets.UNITY_CI_ARTIFACT_PASSWORD }}
        run: python3 unity/ci/cloud_release.py seal
      - name: Save private candidate for owner review
        uses: actions/upload-artifact@v4
        with:
          name: Unity-private-android-${{ github.run_id }}
          path: ${{ runner.temp }}/unity-encrypted/candidate.zip.enc
          if-no-files-found: error
          retention-days: 7
