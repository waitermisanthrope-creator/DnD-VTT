name: Test GLTF loader
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/3dmap/gltf_loader.js'
      - 'tests/gltf_loader_smoke.cjs'
      - 'tests/imported_3d_editor_assets.cjs'
      - 'app/3dmap/gltf_catalog.js'
      - 'app/3dmap/map_model.js'
      - '.github/workflows/test-gltf-loader.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and run synthetic GLB tests
        run: |
          node --check app/3dmap/gltf_loader.js
          node tests/gltf_loader_smoke.cjs
          node tests/imported_3d_editor_assets.cjs
