name: Test GLTF loader
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/3dmap/gltf_loader.js'
      - '.github/workflows/test-gltf-loader.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and run synthetic GLB tests
        run: |
          node --check app/3dmap/gltf_loader.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const src=fs.readFileSync('app/3dmap/gltf_loader.js','utf8');
          const context={window:{},TextDecoder,Uint8Array,ArrayBuffer,DataView,Float32Array,Uint16Array,Uint32Array,Int8Array,Int16Array,Number,Promise,fetch:async()=>{throw Error('not mocked')}};
          vm.runInNewContext(src,context);
          const loader=context.window.DNDGLTF;
          function glb(json,bin){let j=Buffer.from(JSON.stringify(json));j=Buffer.concat([j,Buffer.alloc((4-j.length%4)%4,32)]);bin=Buffer.from(bin);bin=Buffer.concat([bin,Buffer.alloc((4-bin.length%4)%4)]);const b=Buffer.alloc(12+8+j.length+8+bin.length);b.write('glTF',0);b.writeUInt32LE(2,4);b.writeUInt32LE(b.length,8);b.writeUInt32LE(j.length,12);b.write('JSON',16);j.copy(b,20);let o=20+j.length;b.writeUInt32LE(bin.length,o);b.write('BIN\0',o+4);bin.copy(b,o+8);return b;}
          const binary=Buffer.alloc(36);[0,0,0,1,0,0,0,1,0].forEach((v,i)=>binary.writeFloatLE(v,i*4));
          const json={asset:{version:'2.0'},scene:0,scenes:[{nodes:[0]}],nodes:[{mesh:0}],meshes:[{primitives:[{attributes:{POSITION:0}}]}],buffers:[{byteLength:36}],bufferViews:[{buffer:0,byteOffset:0,byteLength:36}],accessors:[{bufferView:0,componentType:5126,count:3,type:'VEC3'}]};
          let calls=0;context.fetch=async()=>{calls++;return {ok:true,arrayBuffer:async()=>Uint8Array.from(glb(json,binary)).buffer}};
          loader.load('synthetic.glb').then(r=>{assert.equal(r.parts.length,1);assert.equal(r.bounds.size[0],1);assert.equal(r.bounds.size[1],1);assert.equal(calls,1);console.log('PASS: GLB triangle bounds');}).catch(e=>{console.error(e);process.exitCode=1});
          JS
