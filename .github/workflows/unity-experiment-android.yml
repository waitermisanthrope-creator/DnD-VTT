name: Unity experiment Android APK

# Legacy debug-only build. Explicit opt-in only: the private cloud candidate
# workflow handles automated paired Windows and Android builds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-experiment-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unity 6 experimental APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity project and license configuration
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(cat unity/ProjectSettings/ProjectVersion.txt | grep -F 'm_EditorVersion: 6000.3.26f1')" != ''
          test -f unity/Assets/Vtt/Scenes/ImportedAdventure.unity
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "::error::Unity license not configured. Add repository Actions secrets UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro), plus UNITY_EMAIL and UNITY_PASSWORD, before building."
            exit 1
          fi
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Unity license credentials missing: UNITY_EMAIL or UNITY_PASSWORD."
            exit 1
          fi

      - name: Build Unity Android (native, isolated debug package)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          unityVersion: 6000.3.26f1
          targetPlatform: Android
          buildMethod: LegacyMigrationSetup.BuildAndroid
          androidExportType: androidPackage

      - name: Verify test APK and record checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="unity/Builds/AndroidMigration/DndVtt-experiment.apk"
          test -s "$APK"
          sha256sum "$APK" | tee "unity/Builds/AndroidMigration/SHA256SUMS.txt"

      - name: Upload Unity experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: DnD-VTT-Unity-Experiment-Android
          path: |
            unity/Builds/AndroidMigration/DndVtt-experiment.apk
            unity/Builds/AndroidMigration/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
