name: Unity cloud promote verified candidate

# Existing paired publisher: explicit owner approval plus successful builds and upgrade QA.
on:
  push:
    branches: [experiment/unity-vtt]
    paths: ['release-staging/unity-paired-approval.json']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Unity cloud private candidate run ID'
        required: true
        type: string
      version:
        description: 'Exact unpublished version from that run'
        required: true
        default: '1.00.17'
        type: string
      publish:
        description: 'Publish both installers and activate channel (only on owner request)'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: unity-binary-delivery
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'waitermisanthrope-creator/DnD-VTT' && github.ref == 'refs/heads/experiment/unity-vtt' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Select explicitly owner-approved candidate
        env:
          MANUAL_RUN: ${{ inputs.run_id }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PYCODE'
          import json,os,re
          from pathlib import Path
          require_review=False;review_sha=''
          if os.environ['GITHUB_EVENT_NAME']=='push':
              request=json.loads(Path('release-staging/unity-paired-approval.json').read_text())
              require_review=request.get('requireRenderReview') is True;review_sha=request.get('approvedRenderIndexSha256','')
              run=str(request['candidateRunId']);version=request['version'];publish=request.get('approved') is True
          else:
              run=os.environ['MANUAL_RUN'];version=os.environ['MANUAL_VERSION'];publish=os.environ['MANUAL_PUBLISH']=='true'
          if not run.isdecimal() or not re.fullmatch(r'[1-9][0-9]{0,3}\.[0-9]{2}\.[0-9]{2}',version):raise SystemExit('Invalid candidate approval')
          if publish and os.environ['GITHUB_ACTOR']!='waitermisanthrope-creator':raise SystemExit('Owner publication approval required')
          if review_sha and not re.fullmatch('[a-f0-9]{64}',review_sha):raise SystemExit('Invalid render review digest')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SELECTED_RUN='+run+'\nSELECTED_VERSION='+version+'\nSELECTED_PUBLISH='+str(publish).lower()+'\nDICE_RENDER_REVIEW_REQUIRED='+str(require_review).lower()+'\nDICE_RENDER_REVIEW_SHA='+review_sha+'\n')
          PYCODE
      - name: Await verified candidate completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for poll in $(seq 1 200); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SELECTED_RUN" --jq '.conclusion // "pending"')"
            if [[ "$result" == success ]]; then break; fi
            if [[ "$result" != pending ]]; then echo "Candidate failed: $result";exit 1;fi
            if (( poll == 200 )); then exit 1;fi
            sleep 25
          done
      - name: Require actual successful cloud builds and upgrade QA
        env:
          GH_TOKEN: ${{ secrets.UNITY_RELEASE_TOKEN || github.token }}
          RUN_ID: ${{ env.SELECTED_RUN }}
        run: python3 unity/ci/promote_candidate.py verify-run --run "$RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SELECTED_RUN }}
          name: Unity-private-candidate-${{ env.SELECTED_RUN }}
          path: ${{ runner.temp }}/encrypted
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SELECTED_RUN }}
          name: Unity-Windows-upgrade-verdict-${{ env.SELECTED_RUN }}
          path: ${{ runner.temp }}/qa
      - name: Download actual native dice render evidence from the verified build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SELECTED_RUN }}
          name: Unity-dice-previews-${{ env.SELECTED_RUN }}
          path: ${{ runner.temp }}/dice-render-evidence
      - name: Decrypt candidate only inside trusted runner
        env:
          UNITY_CI_ARTIFACT_PASSWORD: ${{ secrets.UNITY_CI_ARTIFACT_PASSWORD }}
        run: |
          python3 -m pip install -r unity/ci/requirements.txt
          python3 unity/ci/cloud_release.py unseal --source "$RUNNER_TEMP/encrypted" --destination "$RUNNER_TEMP/candidate"
      - name: Test exact render-review activation boundary
        run: python3 .github/scripts/test_unity_render_review.py
      - name: Verify promotion or perform explicit owner-requested publication
        env:
          GH_TOKEN: ${{ secrets.UNITY_RELEASE_TOKEN || github.token }}
          RUN_ID: ${{ env.SELECTED_RUN }}
          CANDIDATE_VERSION: ${{ env.SELECTED_VERSION }}
          PUBLISH: ${{ env.SELECTED_PUBLISH }}
          DICE_PREVIEW_DIR: ${{ runner.temp }}/dice-render-evidence
        run: |
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' >/dev/null
          args=()
          if [[ "$PUBLISH" == 'true' ]]; then args+=(--publish); fi
          python3 unity/ci/promote_candidate.py promote --run "$RUN_ID" --version "$CANDIDATE_VERSION" --folder "$RUNNER_TEMP/candidate" --qa "$RUNNER_TEMP/qa/windows-upgrade-result.json" "${args[@]}"
