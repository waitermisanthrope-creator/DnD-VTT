plugins {
    id "com.android.application"
}

def vttAssets = layout.buildDirectory.dir("generated/vttAssets").get().asFile

tasks.register("prepareVttAssets", Sync) {
    into(vttAssets)
    from("../../index.html")
    from("../../app") { into("app") }
    from("../../") { include("*.png"); into("wallpapers") }
    from("../../") { include("*.mp3"); into("ambience") }
}

android {
    namespace "com.dndvtt.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.dndvtt.app"
        minSdk 24
        targetSdk 36
        versionCode 7025069
        versionName "70.25.69"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets { main { assets.srcDir(vttAssets) } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.17.1"
}


tasks.named("preBuild").configure { dependsOn("prepareVttAssets") }
