// V74.00.08 release APK — include base character GLB in packaged assets.
// Launch-title fix included in MainActivity. V74.00.03 packages the real wallpapers directory.
plugins {
    id "com.android.application"
}

def vttAssets = layout.buildDirectory.dir("generated/vttAssets").get().asFile
def vttIconRes = layout.buildDirectory.dir("generated/vttIconRes").get().asFile

def launcherDiceFiles = [
    "ChatGPT Image Sep 30, 2026, 07_08_07 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_08_30 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_13_27 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_23_00 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_24_38 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_27_51 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_35_50 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_41_40 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_49_58 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_58_07 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_58_18 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_58_28 PM.png",
    "ChatGPT Image Sep 30, 2026, 07_58_39 PM.png",
    "dice1.png", "dice10-1.png", "dice10.png", "dice11.png", "dice12.png",
    "dice13.png", "dice15.png", "dice16.png", "dice17.png", "dice2.png",
    "dice3.png", "dice4.png", "dice5.png", "dice6.png", "dice7.png",
    "dice8.png", "dice9.png"
]

tasks.register("prepareVttAssets", Sync) {
    into(vttAssets)
    from("../../index.html")
    from("../../app") { into("app") }
    from("../../wallpapers") { include("*.png"); into("wallpapers") }
    from("../../wallpapers") { include("*.svg"); into("wallpapers") }
    from("../../") { include("*.png"); into("") }
    from("../../") { include("*.jpg"); into("") }
    from("../../") { include("*.glb"); into("") }
    from("../../") { include("*.mp3"); into("ambience") }
}

tasks.register("prepareVttIconPreviews", Copy) {
    into(vttAssets)
    from("../../1790788500741.png") {
        rename { "default.png" }
        into("icon_previews")
    }
    launcherDiceFiles.eachWithIndex { sourceName, index ->
        from("../../app/assets/dice/${sourceName}") {
            rename { "dice_${String.format('%02d', index + 1)}.png" }
            into("icon_previews")
        }
    }
}

tasks.register("prepareVttIconResources", Sync) {
    into(vttIconRes)
    from("../../app/assets/dice/dice1.png") {
        rename { "icon_default.png" }
        into("drawable-nodpi")
    }
    launcherDiceFiles.eachWithIndex { sourceName, index ->
        from("../../app/assets/dice/${sourceName}") {
            rename { "icon_dice_${String.format('%02d', index + 1)}.png" }
            into("drawable-nodpi")
        }
    }
}

android {
    namespace "com.dndvtt.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.dndvtt.pocketvtt"
        minSdk 24
        targetSdk 36
        versionCode 7400008
        versionName '74.00.08'
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("DND_VTT_KEYSTORE_FILE")
            def keystorePassword = System.getenv("DND_VTT_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("DND_VTT_KEY_ALIAS")
            def keyPasswordValue = System.getenv("DND_VTT_KEY_PASSWORD")

            if (keystoreFile && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets { main {
        assets.srcDir(vttAssets)
        res.srcDir(vttIconRes)
    } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.17.1"
}

tasks.named("preBuild").configure { dependsOn("prepareVttAssets", "prepareVttIconPreviews", "prepareVttIconResources") }
prepareVttIconPreviews.dependsOn("prepareVttAssets")
